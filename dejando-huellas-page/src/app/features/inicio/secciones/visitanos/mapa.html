<div class="mapa" [class.mapa--cargado]="cargado()">
  @if (cargado()) {
    <iframe
      [src]="fuente()"
      [title]="'Mapa: ubicación de ' + nombre() + ' en Ciudad Quesada'"
      referrerpolicy="no-referrer-when-downgrade"
      data-lenis-prevent
    ></iframe>
  } @else {
    <svg
      class="mapa__dibujo"
      viewBox="0 0 800 340"
      preserveAspectRatio="xMidYMid slice"
      aria-hidden="true"
      focusable="false"
    >
      <!--
        Zona segura del dibujo (se recorta con «slice»): en celulares de 360 px se ve x 94–706; en
        escritorio, y 59–281, y la tarjeta tapa x < 304 abajo a la izquierda. La ruta va dentro de esa zona.
      -->
      <rect width="800" height="340" fill="#DCE3DA" />
      <g fill="#C9D3C6">
        <rect x="20" y="16" width="297" height="80" rx="10" />
        <rect x="343" y="16" width="174" height="80" rx="10" />
        <rect x="543" y="16" width="237" height="80" rx="10" />
        <rect x="20" y="124" width="297" height="200" rx="10" />
        <rect x="543" y="124" width="104" height="200" rx="10" />
        <rect x="673" y="124" width="107" height="200" rx="10" />
      </g>
      <g stroke="#FBF7EF" stroke-width="26" stroke-linecap="round" fill="none">
        <path d="M0 110H800" />
        <path d="M330 0V340" />
        <path d="M530 0V340" />
        <path d="M660 110V340" />
      </g>
      <g stroke="#0D1A3C" stroke-width="2" stroke-dasharray="8 10" fill="none" opacity=".35">
        <path d="M0 110H800" />
        <path d="M330 0V340" />
        <path d="M530 0V340" />
      </g>
      <!-- Caminito interno: la entrada es por aquí, no por la calle principal (hay otro kinder en esa cuadra). -->
      <path
        d="M660 236H560"
        stroke="#FBF7EF"
        stroke-width="14"
        stroke-linecap="round"
        fill="none"
      />
      <!-- La universidad queda del mismo lado de la calle principal que el centro. -->
      <rect x="343" y="124" width="174" height="200" rx="10" fill="#91A8CB" opacity=".55" />
      <text
        x="430"
        y="192"
        text-anchor="middle"
        font-family="Shantell Sans, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#0D1A3C"
      >
        U. de San José
      </text>
      <!-- 50 m al este por la calle principal, 75 m al sur y luego el caminito hasta la puerta. -->
      <path
        d="M430 124 V110 H660 V236 H578"
        fill="none"
        stroke="#C96F62"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-dasharray="2 10"
      />
      <svg appHuella x="540" y="171" width="56" height="58" color="#C96F62" corazon></svg>
    </svg>
    <div class="mapa__texto tela t-manta">
      <strong>{{ nombre() }}</strong>
      <span>{{ senas() }}</span>
      <div class="mapa__acciones">
        <button class="parche parche--chico" type="button" (click)="cargado.set(true)">
          Ver mapa interactivo
        </button>
        <a
          class="enlace-mano"
          [href]="enlaceExterno()"
          target="_blank"
          rel="noopener"
          appRegistrarEvento="clic_mapa"
          ubicacion="mapa"
        >
          Abrir en Google Maps<span class="vh"> (abre en otra pestaña)</span>
        </a>
      </div>
    </div>
  }
</div>
