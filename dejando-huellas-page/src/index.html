<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="utf-8" />
    <title>Centro Infantil Dejando Huella</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8AA0C3" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link
      rel="preload"
      href="fonts/shantell-sans-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="fonts/nunito-var.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Fuentes y texturas con rutas relativas al <base href>: funcionan igual en dejandohuellacr.com
      y en la vista previa de GitHub Pages (que vive en una subcarpeta).
    -->
    <style>
      @font-face {
        font-family: 'Shantell Sans';
        src: url('fonts/shantell-sans-var.woff2') format('woff2');
        font-weight: 500 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('fonts/nunito-var.woff2') format('woff2');
        font-weight: 400 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Big Shoulders Display';
        src: url('fonts/big-shoulders-display-var.woff2') format('woff2');
        font-weight: 700 900;
        font-display: swap;
      }
      :root {
        /* Dos mosaicos de tamaños distintos superpuestos: el patrón casi no vuelve a alinearse */
        --fondo-lino:
          url('textura/hilos.svg') center top / 740px 820px,
          url('textura/lino.svg') 0 0 / 520px 600px, var(--respaldo);
      }
    </style>
    <!--
      La firma de la portada esconde sus piezas mientras se carga la animación (y solo si hay JS y
      movimiento). Si algo falla, se muestran solas a los 3 segundos: nunca queda contenido oculto.
    -->
    <script>
      (function (h) {
        if (window.matchMedia && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          h.classList.add('firma-pendiente');
          setTimeout(function () {
            h.classList.remove('firma-pendiente');
          }, 3000);
        }
      })(document.documentElement);
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
