name: Sitio Dejando Huella

# Calidad en cada cambio del sitio (también los que hace el cliente desde Pages CMS).
# La publicación en GitHub Pages está apagada hasta el lanzamiento: se activa creando la variable
# de repositorio PUBLICAR_SITIO=true (Settings → Secrets and variables → Actions → Variables)
# y eliminando pages.yml, que hoy publica la propuesta.

on:
  push:
    branches: [main, sitio-angular]
    paths: ['dejando-huellas-page/**', '.github/workflows/sitio.yml']
  pull_request:
    paths: ['dejando-huellas-page/**', '.github/workflows/sitio.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitio-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dejando-huellas-page

jobs:
  calidad:
    name: Validar, probar y construir
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dejando-huellas-page/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias y validación del contenido
        run: npm test -- --watch=false
      - name: Build con prerender
        run: npm run build
      - name: Pruebas E2E y accesibilidad (axe)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Guardar el sitio construido
        uses: actions/upload-pages-artifact@v3
        with:
          path: dejando-huellas-page/dist/dejando-huellas-page/browser

  publicar:
    name: Publicar en GitHub Pages
    needs: calidad
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLICAR_SITIO == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
